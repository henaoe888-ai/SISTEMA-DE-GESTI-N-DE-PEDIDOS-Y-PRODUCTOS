<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión de Productos y Pedidos</title>
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap');

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: linear-gradient(160deg, #120a24 0%, #241046 100%);
        }

        body {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 16px;
            font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
            color: #e8e2ff;
            line-height: 1.5;
        }

        h1 {
            margin: 0 0 24px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #00f0ff;
            letter-spacing: 0.02em;
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.45);
        }

        .tarjeta {
            margin: 0 0 24px;
            padding: 20px 24px;
            background: #1c1238;
            border: 1px solid #3a2766;
            border-left: 4px solid #ff2e97;
            border-radius: 10px;
        }

        p {
            margin: 0 0 12px;
            font-size: 0.95rem;
            color: #c9c0ee;
        }

        p:last-child {
            margin-bottom: 0;
        }

        strong {
            display: block;
            margin-bottom: 2px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #00f0ff;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .acciones a {
            margin: 0;
        }

        a {
            display: inline-block;
            margin: 4px 6px 4px 0;
            padding: 8px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            background: #ff2e97;
            border-radius: 999px;
            box-shadow: 0 4px 16px rgba(255, 46, 151, 0.4);
            text-decoration: none;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
        }

        a:hover {
            background: #ff4fa9;
            box-shadow: 0 6px 20px rgba(255, 46, 151, 0.55);
        }

        a:active {
            transform: scale(0.97);
        }

        a.volver {
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: none;
        }

        a.volver:hover {
            background: #00f0ff;
            color: #120a24;
        }

        @media (max-width: 520px) {
            body {
                padding: 28px 14px;
            }

            h1 {
                text-align: center;
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

<h1>Detalle de el Pedido</h1>

<p>
    <strong>Nombre del Pedido:</strong>
    {{ pedidos.nombre }}
</p>

<p>
    <strong>Valor:</strong>
    {{ pedidos.valor }}
</p>

<p>
    <strong>Estado:</strong>
    {{ pedidos.estado }}
</p>

<p>
    <strong>Descripción:</strong>
    {{ pedidos.descripcion }}
</p>

<p>
    <strong>Nombre del registrador:</strong>
    {{ pedidos.registro }}
</p>


<br>

<a href="/pedidos/editar/{{ pedidos.id }}/">
    Editar
</a>

<br><br>

<a href="/pedidos/listar/">
    Volver
</a>

</body>

</html>
